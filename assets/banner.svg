<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Makhalib — natural-language LLM red-teaming, in Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.6" stop-color="#12161d"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0883e"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#2a3038" stroke-width="1" opacity="0.25">
    <line x1="0" y1="85" x2="1280" y2="85"/>
    <line x1="0" y1="170" x2="1280" y2="170"/>
    <line x1="0" y1="255" x2="1280" y2="255"/>
  </g>

  <!-- claw slashes -->
  <g opacity="0.85" filter="url(#soft)">
    <path d="M1015 40 L1120 300" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M1075 35 L1175 295" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <path d="M1135 45 L1225 290" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <text x="90" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="#f5f7fa" letter-spacing="2">MAKHALIB</text>
  <text x="95" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#e3b341" direction="rtl">مخالب</text>
  <text x="235" y="205" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#8b949e">— claws</text>

  <!-- tagline -->
  <text x="92" y="262" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#c9d1d9">Natural-language LLM red-teaming, in Rust.</text>
  <text x="92" y="298" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="19" fill="#f0883e">Describe the attack. Don't code it.</text>

  <!-- org tag -->
  <text x="1190" y="320" text-anchor="end" font-family="'SFMono-Regular', Consolas, monospace" font-size="16" fill="#6e7681">HisnLabs · حصن</text>
</svg>
