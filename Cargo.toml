[package]
name = "makhalib"
version = "0.1.0"
edition = "2021"
description = "Natural-language-driven LLM red-teaming framework (augustus engine + PyRIT orchestration). Authorized security testing only."
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
wiremock = "0.6"

[[bin]]
name = "makhalib"
path = "src/main.rs"

[lib]
name = "makhalib"
path = "src/lib.rs"
